<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diseño de overlay · daij studio</title>
<style>
:root{--bg:#0b1630;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--tx:#eaf3ff;--mut:#9db6d8;--acc:#7dd3fc}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif}
#app{display:grid;grid-template-columns:1fr 300px;grid-template-rows:56px 1fr;height:100%}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(8,16,36,.9)}
header b{font-weight:700}header span{color:var(--mut);font-size:13px}header a{color:var(--acc);font-size:13px;text-decoration:none}
.seg{display:flex;gap:4px;margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;color:var(--mut);padding:7px 14px;border-radius:9px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--acc);color:#07203a;font-weight:600}
main{position:relative;min-height:0;display:flex;flex-direction:column}
#panes{flex:1;min-height:0;display:grid;grid-template-columns:1fr}
main.split #panes{grid-template-columns:1fr 1fr}
.pane{position:relative;min-width:0;min-height:0;display:grid;place-items:center;padding:16px;overflow:hidden}
.pane+.pane{border-left:1px solid var(--line)}
.pane.h{display:none}
#svgw{width:100%;height:100%;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0}
#svgw svg{height:100%;width:auto;max-width:100%;border-radius:6px;box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
#v3{padding:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.lab{position:absolute;left:14px;top:12px;font-size:12px;color:var(--mut);background:rgba(8,16,36,.7);padding:4px 10px;border-radius:99px;border:1px solid var(--line);pointer-events:none;z-index:2}
#tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px;background:rgba(8,16,36,.85);border-top:1px solid var(--line)}
.tb{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--tx);font:inherit;font-size:13px;cursor:pointer}
.tb:hover{border-color:var(--acc)}.tb.on{background:var(--acc);color:#07203a;border-color:var(--acc);font-weight:600}
aside{overflow:auto;border-left:1px solid var(--line);padding:14px;background:rgba(8,16,36,.55)}
aside h3{font-size:13px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin:4px 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h4{font-size:15px;font-weight:600}.card p{font-size:12px;color:var(--mut);margin-top:3px;line-height:1.5}
.it{cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;background:var(--panel)}
.it:hover{border-color:var(--acc)}.it.on{border-color:var(--acc);background:rgba(125,211,252,.12)}
.it b{font-size:14px;font-weight:600}.it small{display:block;color:var(--mut);font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums}
ul{padding-left:18px;font-size:13px;color:var(--mut);line-height:1.5}
#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-20px);background:var(--acc);color:#07203a;font-weight:600;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:all .3s;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:860px){#app{grid-template-columns:1fr;grid-template-rows:56px 1fr 190px}header{grid-column:1}aside{border-left:0;border-top:1px solid var(--line)}header span{display:none}main.split #panes{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.pane+.pane{border-left:0;border-top:1px solid var(--line)}}
</style></head><body>
<div id="app">
<header><b>Diseño de overlay</b><span id="ttl"></span><a href="piezas.html">Piezas 3D</a>
 <div class="seg" id="seg"><button data-v="2d">2D</button><button data-v="3d">3D</button><button data-v="split" class="on">Dividido</button></div></header>
<main id="main" class="split"><div id="panes">
 <div class="pane" id="v2"><div class="lab">Vista 2D</div><div id="svgw"></div></div>
 <div class="pane" id="v3"><div class="lab">Vista 3D · arrastra para girar</div><canvas id="cv"></canvas></div>
 </div>
 <div id="tools">
  <button class="tb on" id="bMed">Medidas</button><button class="tb" id="bGrid">Cuadrícula</button><button class="tb" id="bBg">Fondo: damero</button>
  <button class="tb" id="bFront">3D de frente</button><button class="tb" id="bPersp">3D en perspectiva</button><button class="tb" id="bPng">Guardar PNG 2D</button>
 </div>
</main>
<aside><h3>Proyecto</h3><div class="card"><h4 id="pt"></h4><p id="pm"></p></div>
 <h3>Últimos cambios</h3><div class="card"><ul id="ch"></ul></div>
 <h3>Piezas</h3><div id="pl"></div></aside>
</div><div id="toast"></div>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
<script type="module">
import * as THREE from 'three';

var BGS=[['damero','repeating-conic-gradient(#8a93a6 0 25%,#aab2c2 0 50%) 50%/28px 28px'],['cielo','linear-gradient(140deg,#5d86bd,#2c4a78 55%,#162a4a)'],['oscuro','linear-gradient(160deg,#0a1226,#050912)'],['claro','linear-gradient(160deg,#eef5ff,#cfe0f7)']];
var C={claro:{rim:'#9fc4f5',plate:'#f7faff',ring:'#ffffff',track:'#dbe8f8',f0:'#3b82f6',f1:'#7dd3fc',line:'rgba(120,170,230,.55)'},
 azul:{rim:'#2757c4',plate:'#4f95ff',ring:'#5aa2ff',track:'#2a5fd0',f0:'#ffffff',f1:'#e8f3ff',line:'rgba(255,255,255,.4)'},
 oscuro:{rim:'#4fa3e0',plate:'#0c1a38',ring:'#0e1d3d',track:'#16305f',f0:'#3b82f6',f1:'#7dd3fc',line:'rgba(125,211,252,.4)'}};
var NOMBRES={panel:'Panel',pildora:'Píldora',circulo:'Círculo',progreso:'Barra de progreso',marco:'Marco'};
function dflt(o){var t=o.tipo,w=o.w||200,h=o.h||100,r=o.r;
 if(r==null)r=(t==='pildora'||t==='progreso')?Math.min(w,h)/2:t==='circulo'?Math.min(w,h)/2:34;
 return {id:o.id,tipo:t,nombre:o.nombre||NOMBRES[t]||t,x:o.x||0,y:o.y||0,w:w,h:h,r:r,d:o.d||(t==='progreso'?28:32),rot:o.rot||0,estilo:o.estilo||'claro',p:o.p==null?50:o.p,bw:o.bw||14}}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
/* ---------- 2D ---------- */
function rrp(x,y,w,h,r){r=Math.min(r,w/2,h/2);return 'M'+(x+r)+' '+y+'H'+(x+w-r)+'A'+r+' '+r+' 0 0 1 '+(x+w)+' '+(y+r)+'V'+(y+h-r)+'A'+r+' '+r+' 0 0 1 '+(x+w-r)+' '+(y+h)+'H'+(x+r)+'A'+r+' '+r+' 0 0 1 '+x+' '+(y+h-r)+'V'+(y+r)+'A'+r+' '+r+' 0 0 1 '+(x+r)+' '+y+'Z'}
function obj2d(o,i){var c=C[o.estilo]||C.claro,w=o.w,h=o.h,x=-w/2,y=-h/2,g='',on=sel===o.id;
 if(o.tipo==='marco'){g='<path fill-rule="evenodd" d="'+rrp(x,y,w,h,o.r)+rrp(x+o.bw,y+o.bw,w-2*o.bw,h-2*o.bw,Math.max(o.r-o.bw,4))+'" fill="'+c.ring+'" stroke="'+c.line+'" stroke-width="2" filter="url(#sh)"/>'}
 else if(o.tipo==='progreso'){var fw=Math.max(0,(w-8)*o.p/100);g='<path d="'+rrp(x,y,w,h,o.r)+'" fill="'+c.track+'" stroke="'+c.line+'" stroke-width="2" filter="url(#sh)"/>'+(fw>0?'<path d="'+rrp(x+4,y+4,fw,h-8,Math.max(o.r-4,2))+'" fill="url(#g'+o.estilo+')"/>':'')}
 else{g='<path d="'+rrp(x,y,w,h,o.r)+'" fill="'+(o.estilo==='azul'?'url(#gazulp)':c.plate)+'" stroke="'+c.line+'" stroke-width="2" filter="url(#sh)"/>'}
 var out=on?'<path d="'+rrp(x-6,y-6,w+12,h+12,o.r+6)+'" fill="none" stroke="#ffd34d" stroke-width="4" stroke-dasharray="14 8"/>':'';
 var lab=showMed?'<text x="0" y="'+(y-14)+'" text-anchor="middle" font-size="'+Math.max(18,P.escenario.h/75)+'" font-weight="700" fill="#fff" stroke="#0b1630" stroke-width="5" paint-order="stroke" transform="rotate('+(-o.rot)+')">'+Math.round(w)+' × '+Math.round(h)+'</text>':'';
 return '<g transform="translate('+o.x+','+o.y+') rotate('+o.rot+')" data-id="'+esc(o.id)+'" style="cursor:pointer">'+g+out+lab+'</g>'}
function render2D(){var W=P.escenario.w,H=P.escenario.h;
 var grid='';if(showGrid){for(var x=0;x<=W;x+=100)grid+='<line x1="'+x+'" y1="0" x2="'+x+'" y2="'+H+'" stroke="rgba(255,255,255,.28)" stroke-width="1"/>';for(var y=0;y<=H;y+=100)grid+='<line x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'" stroke="rgba(255,255,255,.28)" stroke-width="1"/>'}
 var defs='<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#143c78" flood-opacity=".45"/></filter>'+
 '<linearGradient id="gclaro"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient><linearGradient id="gazul"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e8f3ff"/></linearGradient><linearGradient id="goscuro"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>'+
 '<linearGradient id="gazulp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f6fe0"/><stop offset="1" stop-color="#5aa2ff"/></linearGradient></defs>';
 var s='<svg id="s2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'" style="aspect-ratio:'+W+'/'+H+';background:'+BGS[bgI][1]+'" >'+defs+grid+
  '<rect x="1" y="1" width="'+(W-2)+'" height="'+(H-2)+'" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2" stroke-dasharray="10 8"/>'+P.piezas.map(obj2d).join('')+'</svg>';
 $('svgw').innerHTML=s;
 [].forEach.call($('svgw').querySelectorAll('[data-id]'),function(g){g.onclick=function(){pick(g.getAttribute('data-id'))}})}
/* ---------- 3D ---------- */
var cv=$('cv'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true,preserveDrawingBuffer:true});
R.setPixelRatio(Math.min(2,devicePixelRatio||1));R.outputColorSpace=THREE.SRGBColorSpace;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;R.setClearColor(0x0b1630,1);
var scn=new THREE.Scene(),pm=new THREE.PMREMGenerator(R);scn.environment=pm.fromScene(new RoomEnvironment(),.04).texture;
var cam=new THREE.PerspectiveCamera(32,1,.1,500);
var k1=new THREE.DirectionalLight(0xffffff,1.5);k1.position.set(-6,10,14);scn.add(k1);var k2=new THREE.DirectionalLight(0x9fd0ff,.7);k2.position.set(8,2,-6);scn.add(k2);
var ctl=new OrbitControls(cam,cv);ctl.enableDamping=true;ctl.dampingFactor=.08;ctl.maxDistance=200;ctl.minDistance=1;
var grp=new THREE.Group();scn.add(grp);var U=.01;
function path(sh,w,h,r){r=Math.min(r,w/2,h/2);var x=-w/2,y=-h/2;sh.moveTo(x+r,y);sh.lineTo(x+w-r,y);sh.absarc(x+w-r,y+r,r,-Math.PI/2,0,false);sh.lineTo(x+w,y+h-r);sh.absarc(x+w-r,y+h-r,r,0,Math.PI/2,false);sh.lineTo(x+r,y+h);sh.absarc(x+r,y+h-r,r,Math.PI/2,Math.PI,false);sh.lineTo(x,y+r);sh.absarc(x+r,y+r,r,Math.PI,Math.PI*1.5,false);return sh}
function mt(col,rough,sel_){var m=new THREE.MeshPhysicalMaterial({color:col,roughness:rough,clearcoat:.5,clearcoatRoughness:.15,metalness:0});if(sel_)m.emissive=new THREE.Color(0x3a2a00);return m}
function slab(w,h,r,d,m,z0,hole){var b=Math.min(d*.2,.04),sh=path(new THREE.Shape(),w-2*b,h-2*b,Math.max(r-b,.01));
 if(hole)sh.holes.push(path(new THREE.Path(),hole.w+2*b,hole.h+2*b,hole.r+b));
 var g=new THREE.ExtrudeGeometry(sh,{depth:Math.max(d-2*b,.002),bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:3,curveSegments:24});var me=new THREE.Mesh(g,m);me.position.z=z0+b;return me}
function build3D(){while(grp.children.length){var c=grp.children.pop();c.traverse(function(n){if(n.geometry)n.geometry.dispose();if(n.material)n.material.dispose&&n.material.dispose()})}
 var W=P.escenario.w,H=P.escenario.h;
 var bgc={0:0x4a5266,1:0x2c4a78,2:0x0a1226,3:0xcfe0f7}[bgI];
 var st=new THREE.Mesh(new THREE.PlaneGeometry(W*U,H*U),new THREE.MeshBasicMaterial({color:bgc,transparent:true,opacity:.55}));st.position.z=-.04;grp.add(st);
 var ed=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([[-W,-H],[W,-H],[W,H],[-W,H]].map(function(p){return new THREE.Vector3(p[0]*U/2,p[1]*U/2,-.03)})),new THREE.LineBasicMaterial({color:0xffffff}));grp.add(ed);
 P.piezas.forEach(function(o,i){var c=C[o.estilo]||C.claro,on=sel===o.id,g=new THREE.Group(),w=o.w*U,h=o.h*U,d=o.d*U,r=o.r*U,m=14*U;
  if(o.tipo==='marco'){var bw=o.bw*U;g.add(slab(w,h,r,d,mt(c.ring,.28,on),0,{w:w-2*bw,h:h-2*bw,r:Math.max(r-bw,.04)}))}
  else if(o.tipo==='progreso'){g.add(slab(w,h,r,d,mt(c.rim,.3,on),0));var ins=Math.min(h*.18,.06);g.add(slab(w-2*ins,h-2*ins,Math.max(r-ins,.02),.03,mt(c.track,.5,false),d-.02));
   var fw=Math.max(.001,(w-4*ins)*o.p/100);var f=slab(fw,h-4*ins,Math.max(r-2*ins,.02),.06,mt(c.f0,.3,false),d-.01);f.position.x=-(w-4*ins)/2+fw/2;g.add(f)}
  else{g.add(slab(w,h,r,d,mt(c.rim,.3,on),0));var mm=Math.min(m,Math.min(w,h)*.2);g.add(slab(w-2*mm,h-2*mm,Math.max(r-mm,.04),.05,mt(c.plate,o.estilo==='oscuro'?.3:.35,false),d-.015))}
  g.position.set((o.x-W/2)*U,-(o.y-H/2)*U,i*.004);g.rotation.z=-o.rot*Math.PI/180;grp.add(g)})}
function front(){var H=P.escenario.h*U,W=P.escenario.w*U,asp=cam.aspect,d=Math.max(H/2/Math.tan(THREE.MathUtils.degToRad(16)),W/2/Math.tan(THREE.MathUtils.degToRad(16))/Math.max(.4,asp))*1.12;cam.position.set(0,0,d);ctl.target.set(0,0,0);ctl.update()}
function persp(){var H=P.escenario.h*U,W=P.escenario.w*U,asp=cam.aspect,d=Math.max(H/2/Math.tan(THREE.MathUtils.degToRad(16)),W/2/Math.tan(THREE.MathUtils.degToRad(16))/Math.max(.4,asp))*1.2;var v=new THREE.Vector3(-.5,.38,1).normalize();cam.position.copy(v.multiplyScalar(d));ctl.target.set(0,0,0);ctl.update()}
function resize(){var m=$('v3'),w=m.clientWidth,h=m.clientHeight;if(!w||!h)return;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
(function loop(){requestAnimationFrame(loop);if(view!=='2d'){ctl.update();R.render(scn,cam)}})();
/* ---------- UI ---------- */
function lista(){$('pl').innerHTML=P.piezas.map(function(o){var ex=o.tipo==='progreso'?' · '+o.p+'%':o.tipo==='marco'?' · borde '+o.bw:'';
 return '<div class="it'+(sel===o.id?' on':'')+'" data-id="'+esc(o.id)+'"><b>'+esc(o.nombre)+'</b><small>'+esc(NOMBRES[o.tipo]||o.tipo)+' · '+o.estilo+'</small><small>'+Math.round(o.w)+' × '+Math.round(o.h)+' px · x '+Math.round(o.x)+', y '+Math.round(o.y)+ex+'</small></div>'}).join('');
 [].forEach.call($('pl').querySelectorAll('.it'),function(e){e.onclick=function(){pick(e.getAttribute('data-id'))}})}
function pick(id){sel=(sel===id)?null:id;lista();render2D();build3D()}
function ui(){$('ttl').textContent=P.titulo||'';$('pt').textContent=P.titulo||'Proyecto';$('pm').textContent='Versión '+P.version+' · '+(P.actualizado||'')+' · lienzo '+P.escenario.w+' × '+P.escenario.h+' px';
 $('ch').innerHTML=(P.cambios||[]).map(function(c){return '<li>'+esc(c)+'</li>'}).join('')||'<li>Sin cambios</li>';lista();render2D();build3D()}
function setView(v){view=v;var m=$('main');m.classList.toggle('split',v==='split');$('v2').classList.toggle('h',v==='3d');$('v3').classList.toggle('h',v==='2d');
 document.querySelectorAll('#seg button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)});setTimeout(function(){resize();front()},50)}
document.querySelectorAll('#seg button').forEach(function(b){b.onclick=function(){setView(b.dataset.v)}});
$('bMed').onclick=function(){showMed=!showMed;$('bMed').classList.toggle('on',showMed);render2D()};
$('bGrid').onclick=function(){showGrid=!showGrid;$('bGrid').classList.toggle('on',showGrid);render2D()};
$('bBg').onclick=function(){bgI=(bgI+1)%BGS.length;$('bBg').textContent='Fondo: '+BGS[bgI][0];render2D();build3D()};
$('bFront').onclick=front;$('bPersp').onclick=persp;
$('bPng').onclick=function(){var svg=$('s2').cloneNode(true);svg.style.background='none';svg.removeAttribute('style');svg.setAttribute('width',P.escenario.w);svg.setAttribute('height',P.escenario.h);
 [].forEach.call(svg.querySelectorAll('[stroke-dasharray="14 8"]'),function(e){e.remove()});
 var img=new Image();img.onload=function(){var c=document.createElement('canvas');c.width=P.escenario.w;c.height=P.escenario.h;c.getContext('2d').drawImage(img,0,0);c.toBlob(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='diseno-2d.png';a.click()})};
 img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(svg))};
addEventListener('resize',function(){resize()});
/* ---------- carga y actualizacion automatica ---------- */
function load(first){return fetch('proyecto.json?t='+Date.now()).then(function(r){return r.json()}).then(function(j){
  j.piezas=(j.piezas||[]).map(dflt);if(!first&&P&&j.version===P.version)return;var nv=P&&j.version!==P.version;P=j;ui();if(first){resize();front()}if(nv)toast('Diseño actualizado a la versión '+j.version)}).catch(function(){if(first)$('pm').textContent='No se pudo cargar proyecto.json'})}
load(true);setInterval(function(){load(false)},15000);
window.__app={get P(){return P},setView:setView,front:front,persp:persp};
</script></body></html>
