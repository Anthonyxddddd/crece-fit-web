<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Piezas 3D · daij studio</title>
<meta name="description" content="Paneles y marcos 3D para overlays: gíralos, acércalos y descárgalos. Hechos con Blender por daij studio.">
<style>
:root{--bg:#0b1630;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--tx:#eaf3ff;--mut:#9db6d8;--acc:#7dd3fc}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif}
#app{display:grid;grid-template-columns:260px 1fr;grid-template-rows:56px 1fr;height:100%}
header{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(8,16,36,.9)}
header b{font-weight:700;letter-spacing:.2px}header span{color:var(--mut);font-size:13px}
.seg{display:flex;gap:4px;margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;color:var(--mut);padding:7px 14px;border-radius:9px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--acc);color:#07203a;font-weight:600}
aside{overflow:auto;border-right:1px solid var(--line);padding:12px;background:rgba(8,16,36,.55)}
.it{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;border:1px solid transparent;cursor:pointer;margin-bottom:6px;color:var(--mut)}
.it:hover{background:var(--panel)}.it.on{background:var(--panel);border-color:var(--acc);color:var(--tx)}
.it img{width:74px;height:56px;object-fit:contain;border-radius:8px;background:rgba(88,128,190,.35)}
.it small{display:block;font-size:11px;opacity:.7}
main{position:relative;min-height:0}
#bgl{position:absolute;inset:0;transition:background .4s}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
#name{position:absolute;left:18px;top:14px;pointer-events:none}
#name h2{font-size:20px;font-weight:600}#name p{font-size:13px;color:var(--mut);margin-top:2px}
#tools{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:8px;background:rgba(8,16,36,.82);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(10px);max-width:calc(100% - 24px)}
.tb{display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--tx);font:inherit;font-size:13px;cursor:pointer}
.tb:hover{border-color:var(--acc)}.tb.on{background:var(--acc);color:#07203a;border-color:var(--acc);font-weight:600}
.tb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sep{width:1px;background:var(--line);margin:2px 2px}
#hint{position:absolute;right:16px;top:16px;font-size:12px;color:var(--mut);text-align:right;pointer-events:none;line-height:1.5}
#load{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:14px;pointer-events:none;transition:opacity .3s}
@media(max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:56px 112px 1fr}header{grid-column:1}
 aside{display:flex;gap:8px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
 .it{flex:0 0 auto;margin:0;flex-direction:column;gap:2px;padding:6px;width:96px}.it img{width:80px;height:50px}.it small{display:none}
 #hint{display:none}.seg button{padding:7px 10px}header span{display:none}}
</style></head><body>
<div id="app">
<header><b>Piezas 3D</b><span>daij studio</span><a href="./" style="color:var(--acc);font-size:13px;text-decoration:none;margin-left:8px">Ver el diseño</a>
 <div class="seg" id="seg"><button data-s="claro" class="on">Claro</button><button data-s="azul">Azul</button><button data-s="oscuro">Oscuro</button></div></header>
<aside id="list"></aside>
<main id="main"><div id="bgl"></div><canvas id="cv"></canvas>
 <div id="name"><h2 id="nm"></h2><p id="sz"></p></div>
 <div id="hint">Arrastra para girar<br>Rueda o pellizco para acercar<br>Clic derecho para mover</div>
 <div id="load">Cargando…</div>
 <div id="tools">
  <button class="tb on" id="bRot" title="Girar solo"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>Auto-girar</button>
  <button class="tb" id="bReset"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>Vista inicial</button>
  <button class="tb" id="bFront"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/></svg>De frente</button>
  <button class="tb" id="bWire"><svg viewBox="0 0 24 24"><path d="M12 3l9 5v8l-9 5-9-5V8zM3 8l9 5 9-5M12 13v8"/></svg>Malla</button>
  <div class="sep"></div>
  <button class="tb" id="bBg"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg><span id="bgT">Fondo: cielo</span></button>
  <div class="sep"></div>
  <button class="tb" id="bPng"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-5-8 8"/></svg>Guardar PNG</button>
  <button class="tb" id="bGlb"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 11l5 5 5-5M4 20h16"/></svg>Modelo .glb</button>
 </div></div></div>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
var $=function(i){return document.getElementById(i)};
var PIECES=[['panel-grande','Panel grande','640 x 520 px'],['panel-mediano','Panel mediano','640 x 300 px'],['panel-cuadrado','Panel cuadrado','420 x 420 px'],['panel-ancho','Panel ancho','900 x 150 px'],['barra','Barra','640 x 120 px'],['pildora','Píldora','360 x 90 px'],['circulo','Círculo','140 x 140 px'],['progreso','Barra de progreso','640 x 52 px'],['marco-camara','Marco de cámara','520 x 390 px'],['marco-vertical','Marco de pantalla vertical','1080 x 1920 px'],['marco-horizontal','Marco de pantalla horizontal','1920 x 1080 px']];
var BGS=[['cielo','linear-gradient(140deg,#5d86bd,#2c4a78 55%,#162a4a)'],['oscuro','linear-gradient(160deg,#0a1226,#050912)'],['claro','linear-gradient(160deg,#eef5ff,#cfe0f7)'],['cuadros','repeating-conic-gradient(#8a93a6 0 25%,#aab2c2 0 50%) 50%/28px 28px']];
var st={style:'claro',piece:'panel-grande',bg:0,rot:true,wire:false}, q=new URLSearchParams(location.search);
if(q.get('e'))st.style=q.get('e'); if(q.get('p'))st.piece=q.get('p'); if(q.get('f'))st.bg=+q.get('f')||0;
/* escena */
var cv=$('cv'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true,preserveDrawingBuffer:true});
R.setPixelRatio(Math.min(2,devicePixelRatio||1));R.outputColorSpace=THREE.SRGBColorSpace;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;R.setClearColor(0x000000,0);
var scn=new THREE.Scene(),pm=new THREE.PMREMGenerator(R);scn.environment=pm.fromScene(new RoomEnvironment(),.04).texture;
var cam=new THREE.PerspectiveCamera(32,1,.05,200);
var key=new THREE.DirectionalLight(0xffffff,1.6);key.position.set(-4,6,6);scn.add(key);
var rim=new THREE.DirectionalLight(0x9fd0ff,.8);rim.position.set(5,2,-5);scn.add(rim);
var ctl=new OrbitControls(cam,cv);ctl.enableDamping=true;ctl.dampingFactor=.08;ctl.autoRotate=true;ctl.autoRotateSpeed=1.4;ctl.minDistance=.8;ctl.maxDistance=40;
var cache={},cur=null,R0=2,loader=new GLTFLoader();
function resize(){var m=$('main'),w=m.clientWidth,h=m.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',resize);
function fit(front){var b=new THREE.Box3().setFromObject(cur),s=b.getBoundingSphere(new THREE.Sphere()),c=s.center;R0=s.radius;
 var d=R0/Math.tan(THREE.MathUtils.degToRad(cam.fov/2))*1.1,asp=cam.aspect;if(asp<1)d/=Math.max(.55,asp);
 var dir=front?new THREE.Vector3(0,0,1):new THREE.Vector3(-.45,.32,1).normalize();cam.position.copy(c).addScaledVector(dir,d);ctl.target.copy(c);ctl.update()}
function setWire(o){o.traverse(function(m){if(m.isMesh){(Array.isArray(m.material)?m.material:[m.material]).forEach(function(x){x.wireframe=st.wire})}})}
function show(){$('load').style.opacity=1;var f='models/'+st.piece+'-'+st.style+'.glb';
 var go=function(g){if(cur)scn.remove(cur);cur=g.scene.clone(true);scn.add(cur);setWire(cur);fit(false);$('load').style.opacity=0};
 if(cache[f])return go(cache[f]);loader.load(f,function(g){cache[f]=g;go(g)},undefined,function(){$('load').textContent='No se pudo cargar el modelo'})}
function meta(){var p=PIECES.filter(function(x){return x[0]===st.piece})[0];$('nm').textContent=p[1]+' · '+st.style[0].toUpperCase()+st.style.slice(1);$('sz').textContent='Medida en overlay: '+p[2]}
function list(){var l=$('list');l.innerHTML='';PIECES.forEach(function(p){var d=document.createElement('div');d.className='it'+(p[0]===st.piece?' on':'');
 d.innerHTML='<img src="img/'+p[0]+'-'+st.style+'.webp" alt=""><div>'+p[1]+'<small>'+p[2]+'</small></div>';d.onclick=function(){st.piece=p[0];list();meta();show()};l.appendChild(d)})}
document.querySelectorAll('#seg button').forEach(function(b){b.onclick=function(){st.style=b.dataset.s;document.querySelectorAll('#seg button').forEach(function(x){x.classList.toggle('on',x===b)});list();meta();show()}});
document.querySelectorAll('#seg button').forEach(function(x){x.classList.toggle('on',x.dataset.s===st.style)});
$('bRot').onclick=function(){st.rot=!st.rot;ctl.autoRotate=st.rot;$('bRot').classList.toggle('on',st.rot)};
$('bReset').onclick=function(){fit(false)};$('bFront').onclick=function(){fit(true);st.rot=false;ctl.autoRotate=false;$('bRot').classList.remove('on')};
$('bWire').onclick=function(){st.wire=!st.wire;$('bWire').classList.toggle('on',st.wire);if(cur)setWire(cur)};
function bg(){$('bgl').style.background=BGS[st.bg][1];$('bgT').textContent='Fondo: '+BGS[st.bg][0]}
$('bBg').onclick=function(){st.bg=(st.bg+1)%BGS.length;bg()};
function dl(url,name){var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}
$('bPng').onclick=function(){R.render(scn,cam);cv.toBlob(function(b){dl(URL.createObjectURL(b),st.piece+'-'+st.style+'.png')},'image/png')};
$('bGlb').onclick=function(){dl('models/'+st.piece+'-'+st.style+'.glb',st.piece+'-'+st.style+'.glb')};
cv.addEventListener('pointerdown',function(){ctl.autoRotate=false});
cv.addEventListener('pointerup',function(){ctl.autoRotate=st.rot});
addEventListener('keydown',function(e){if(e.key===' '){$('bRot').click();e.preventDefault()}});
(function loop(){requestAnimationFrame(loop);ctl.update();R.render(scn,cam)})();
resize();bg();list();meta();show();window.__ready=true;window.__v={st:st,ctl:ctl,cam:cam,R:R};
</script></body></html>
