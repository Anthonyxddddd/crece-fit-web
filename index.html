<!doctype html>
<html lang="es">
<head>

<title>Crece Fit</title>
<link rel="stylesheet" href="css/app.css">
<style>
#splash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 38%,#1d2a78 0,#0e1130 55%,#070914 100%);color:#fff;clip-path:circle(150% at 50% 42%)}
#splash .slogo{width:132px;height:132px;filter:drop-shadow(0 18px 40px rgba(43,127,224,.55))}
#splash .lgo{width:100%;height:100%;display:block}
#splash .sname{margin-top:22px;font-size:34px;font-weight:900;letter-spacing:-.5px;display:flex}
#splash .stag{margin-top:8px;font-size:13px;color:#9aa4d0;font-weight:600;letter-spacing:.4px}
</style>
</head>
<body>
<div id="splash"><div class="sgl"></div><div class="slogo"><svg class="lgo" viewBox="0 0 512 512" aria-hidden="true">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1f7a"/><stop offset=".55" stop-color="#2b7fe0"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<radialGradient id="gl" cx=".28" cy=".18" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="ar" gradientUnits="userSpaceOnUse" x1="256" y1="340" x2="256" y2="198"><stop offset="0" stop-color="#7ee33a"/><stop offset="1" stop-color="#d9f99d"/></linearGradient>
</defs>
<rect width="512" height="512" rx="116" fill="url(#bg)"/>
<rect width="512" height="512" rx="116" fill="url(#gl)"/>
<path class="rg" pathLength="1" d="M366.3,181.8 A140,140 0 1 0 366.3,354.2" fill="none" stroke="#fff" stroke-width="58" stroke-linecap="round"/>
<g class="ar" fill="none" stroke="url(#ar)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"><path d="M256,336V206"/><path d="M204,254L256,202L308,254"/></g>
</svg></div><b class="sname"><span>C</span><span>r</span><span>e</span><span>c</span><span>e</span><span class="sp">&nbsp;</span><span>F</span><span>i</span><span>t</span></b><div class="stag">Entrena · Crece · Sé constante</div></div>
<div id="app"></div>
<div id="overlay"></div>
<div id="sheet"></div>
<div id="modal"></div>
<div id="toast"></div>

</html>
