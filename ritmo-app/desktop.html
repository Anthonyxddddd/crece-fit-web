<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Music</title>
<style>
:root{--bg:#090d18;--side:#0c1120;--panel:#0d1322;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.09);--line:rgba(255,255,255,.08);--tx:#f2f5fb;--mut:rgba(220,230,250,.6);--acc:#4aa8ff;--ease:cubic-bezier(.22,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}input{font:inherit;color:inherit}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:Inter,-apple-system,system-ui,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em;flex:none}svg.i.f{fill:currentColor;stroke:currentColor;stroke-width:1}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px;border:2px solid transparent;background-clip:content-box}
#app{display:grid;grid-template-columns:240px 1fr 0;grid-template-rows:1fr 92px;height:100%;transition:grid-template-columns .35s var(--ease)}
#app.pan{grid-template-columns:240px 1fr 340px}
#side{grid-row:1;background:var(--side);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.logo{display:flex;align-items:center;gap:11px;padding:0 10px 22px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.logo svg{width:34px;height:34px}
.nv{display:flex;align-items:center;gap:13px;padding:11px 12px;border-radius:11px;color:var(--mut);font-weight:600;font-size:14.5px;text-align:left;width:100%;transition:background .2s,color .2s}
.nv:hover{background:var(--card);color:var(--tx)}.nv.on{background:var(--card2);color:#fff}.nv .i{font-size:19px}
.sec{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--mut);padding:18px 12px 6px;text-transform:uppercase;opacity:.75}
#main{grid-row:1;overflow:hidden;display:flex;flex-direction:column;min-width:0;position:relative}
#top{display:flex;align-items:center;gap:12px;padding:16px 28px;z-index:3;background:linear-gradient(var(--bg),rgba(9,13,24,.85));backdrop-filter:blur(14px)}
.rb{width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:18px}.rb:hover{background:var(--card2)}.rb:disabled{opacity:.35;cursor:default}
.sb{flex:1;max-width:460px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid transparent;border-radius:99px;padding:0 16px;height:40px;transition:border .2s,background .2s}.sb:focus-within{border-color:var(--acc);background:var(--card2)}
.sb input{flex:1;background:none;border:0;outline:0;font-size:14.5px}.sb input::placeholder{color:var(--mut)}
#view{flex:1;overflow-y:auto;padding:6px 28px 40px}
h1{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:10px 0 18px}h2.s{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:32px 0 14px;display:flex;justify-content:space-between;align-items:baseline}h2.s a{font-size:13px;color:var(--acc);cursor:pointer;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:22px 18px}
.cd{cursor:pointer;border-radius:14px;padding:10px;margin:-10px;transition:background .2s;position:relative;min-width:0}.cd:hover{background:var(--card)}
.cd .cv{width:100%;aspect-ratio:1;border-radius:11px;box-shadow:0 14px 26px -14px rgba(0,0,0,.7)}.cd.ar .cv{border-radius:50%}
.cd b{display:block;font-size:14.5px;margin-top:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cd.ar b{text-align:center}.cd span{display:block;font-size:12.5px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cd.ar span{text-align:center}
.cd .pl{position:absolute;right:20px;bottom:70px;width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:18px;opacity:0;transform:translateY(8px);transition:.25s var(--ease);box-shadow:0 8px 20px rgba(0,0,0,.45)}.cd:hover .pl{opacity:1;transform:none}.cd.ar .pl{display:none}
.cv{background:#1a2440;display:grid;place-items:center;color:rgba(255,255,255,.5);font-size:34px;background-size:cover!important;background-position:center!important;overflow:hidden}
.gc{border-radius:16px;padding:16px;color:#fff;position:relative;overflow:hidden;min-height:112px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;transition:transform .25s var(--ease)}.gc:hover{transform:translateY(-3px) scale(1.01)}
.gc .gi{position:absolute;right:-6px;top:-6px;font-size:92px;opacity:.2;transform:rotate(14deg);stroke-width:1.5}.gc b{font-size:17px;position:relative}.gc span{font-size:12.5px;opacity:.85;position:relative}
.hero{display:flex;gap:26px;align-items:flex-end;padding:18px 0 8px}.hero .cv{width:210px;height:210px;border-radius:14px;flex:none;box-shadow:0 26px 50px -20px rgba(0,0,0,.8);font-size:70px}.hero.ar .cv{border-radius:50%}.hero small{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}.hero h1{font-size:46px;margin:6px 0 8px;line-height:1.05}.hero p{color:var(--mut);font-size:14px}
.acts{display:flex;gap:12px;align-items:center;margin:22px 0 10px}.btn{display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 24px;border-radius:99px;font-weight:700;font-size:14.5px;background:var(--acc);color:#fff;transition:transform .15s,filter .2s}.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.97)}.btn.g{background:var(--card2)}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;position:sticky;top:0;background:var(--bg)}th.n,td.n{width:50px;text-align:center}th.d,td.d{text-align:right;width:80px}
td{padding:7px 12px;border-radius:0;color:var(--mut);max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}tr.r{cursor:default;transition:background .15s}tr.r:hover{background:var(--card)}tr.r td:first-child{border-radius:9px 0 0 9px}tr.r td:last-child{border-radius:0 9px 9px 0}
td.t{display:flex;align-items:center;gap:12px;color:var(--tx);font-weight:600}td.t .cv{width:42px;height:42px;border-radius:7px;font-size:18px;flex:none}td.t b{display:block;overflow:hidden;text-overflow:ellipsis}td.t span{display:block;color:var(--mut);font-weight:500;font-size:12.5px}
tr.r.on td.t b,tr.r.on td.n{color:var(--acc)}tr.r .pn{display:none;font-size:15px;color:#fff}tr.r:hover .pn{display:inline}tr.r:hover .nn{display:none}
.eqb{display:none;gap:2px;align-items:flex-end;height:14px;justify-content:center}tr.r.on.pp .eqb{display:flex}tr.r.on.pp .nn,tr.r.on.pp:hover .pn{display:none}tr.r.on.pp:hover .eqb{display:flex}.eqb i{width:3px;background:var(--acc);border-radius:2px;animation:eq 1s ease-in-out infinite}.eqb i:nth-child(2){animation-delay:.25s}.eqb i:nth-child(3){animation-delay:.5s}@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.hb{opacity:.0;font-size:16px;color:var(--mut)}tr.r:hover .hb,.hb.on{opacity:1}.hb.on{color:#ff5a7e}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}.chip{padding:8px 16px;border-radius:99px;background:var(--card);font-weight:600;font-size:13.5px;cursor:pointer}.chip:hover{background:var(--card2)}
.row2{display:flex;gap:18px;overflow-x:auto;padding:4px 2px 16px}.row2 .cd{flex:none;width:168px}.row2 .gc{flex:none;width:200px}
.empty{color:var(--mut);padding:50px 0;text-align:center;font-size:15px}
/* panel */
#panel{grid-row:1;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;min-width:0}
.tabs{display:flex;gap:6px;padding:14px 16px 8px}.tabs button{padding:8px 16px;border-radius:99px;font-weight:700;font-size:13.5px;color:var(--mut)}.tabs button.on{background:var(--card2);color:#fff}
#pbody{flex:1;overflow-y:auto;padding:6px 16px 20px}
.qi{display:flex;align-items:center;gap:11px;padding:7px 8px;border-radius:10px;cursor:pointer}.qi:hover{background:var(--card)}.qi .cv{width:40px;height:40px;border-radius:7px;font-size:16px;flex:none}.qi b{font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.qi span{font-size:12px;color:var(--mut)}.qi div{min-width:0}.qi.on b{color:var(--acc)}
#lyr{padding:18vh 0}#lyr .ll{font-size:24px;line-height:1.28;font-weight:800;color:rgba(255,255,255,.3);padding:8px 2px;cursor:pointer;transition:color .45s var(--ease),transform .6s var(--ease),filter .6s var(--ease);transition-delay:calc(var(--d,0)*28ms);transform-origin:left center;filter:blur(var(--b,0px))}#lyr .ll.past{color:rgba(255,255,255,.5)}#lyr .ll.on{color:#fff;transform:scale(1.04);filter:none;transition-delay:0s;animation:lpop .7s var(--ease)}#lyr.plain .ll{font-size:17px;font-weight:600;color:rgba(255,255,255,.85);filter:none;cursor:default;transition-delay:0s}
@keyframes lpop{0%{transform:translateY(14px) scale(.94);opacity:.4}60%{transform:translateY(-2px) scale(1.06)}100%{transform:scale(1.04);opacity:1}}
.lm{color:var(--mut);text-align:center;padding:60px 12px;font-size:14.5px;line-height:1.6}.lm button{margin-top:14px;padding:10px 18px;border-radius:99px;background:var(--card2);font-weight:700}
/* barra del reproductor */
#bar{grid-column:1/-1;grid-row:2;background:rgba(10,15,28,.92);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(220px,1fr) minmax(380px,2fr) minmax(220px,1fr);align-items:center;gap:18px;padding:0 22px;z-index:5}
.np{display:flex;align-items:center;gap:14px;min-width:0}.np .cv{width:60px;height:60px;border-radius:9px;flex:none;font-size:24px}.np b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.np span{font-size:12.5px;color:var(--mut)}.np div{min-width:0}
.ct{display:flex;flex-direction:column;align-items:center;gap:7px}.cb{display:flex;align-items:center;gap:18px}.cb button{font-size:19px;color:var(--mut);position:relative;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;transition:color .2s,transform .15s}.cb button:hover{color:#fff}.cb button:active{transform:scale(.9)}.cb button.on{color:var(--acc)}.cb button.on::after{content:"";position:absolute;bottom:-1px;width:4px;height:4px;border-radius:50%;background:var(--acc)}
.cb .pp{width:46px;height:46px;background:#fff;color:#0a0f1c;font-size:20px}.cb .pp:hover{color:#0a0f1c;transform:scale(1.07)}
.sk{display:flex;align-items:center;gap:11px;width:100%;max-width:640px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:5px;background:linear-gradient(90deg,#fff var(--p,0%),rgba(255,255,255,.2) var(--p,0%));outline:0;cursor:pointer;flex:1}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;opacity:0;transition:opacity .15s}input[type=range]:hover::-webkit-slider-thumb,input[type=range]:active::-webkit-slider-thumb{opacity:1}input[type=range]:hover{background:linear-gradient(90deg,var(--acc) var(--p,0%),rgba(255,255,255,.2) var(--p,0%))}
.rt{display:flex;align-items:center;justify-content:flex-end;gap:6px}.rt button{font-size:18px;color:var(--mut);width:36px;height:36px;display:grid;place-items:center;border-radius:50%}.rt button:hover{color:#fff}.rt button.on{color:var(--acc)}.rt input[type=range]{flex:none;width:100px}
.rt select{background:var(--card);color:var(--tx);border:0;border-radius:8px;padding:6px 8px;font-size:12.5px;outline:0;cursor:pointer}.rt select option{background:#12192e}
#login{position:fixed;inset:0;z-index:50;background:radial-gradient(60% 60% at 50% 30%,#12265a,var(--bg));display:none;place-items:center}#login.on{display:grid}
.lc{width:min(92vw,400px);background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:34px 30px;text-align:center;box-shadow:0 40px 80px -30px rgba(0,0,0,.8)}.lc svg.lg{width:70px;height:70px;margin-bottom:12px}.lc h3{font-size:23px;margin-bottom:8px}.lc p{color:var(--mut);font-size:14px;line-height:1.5}
.lc input{width:100%;margin-top:20px;padding:15px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:26px;text-align:center;letter-spacing:.35em;outline:0}.lc input:focus{border-color:var(--acc)}.lc .btn{width:100%;justify-content:center;margin-top:14px}
#net{position:fixed;top:0;left:50%;transform:translate(-50%,-120%);background:#3a1f2a;border:1px solid rgba(255,120,140,.4);color:#ffd6dd;padding:10px 20px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:70;transition:transform .35s var(--ease)}#net.on{transform:translate(-50%,14px)}
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:#1a2440;border:1px solid var(--line);padding:11px 20px;border-radius:99px;font-size:14px;opacity:0;transition:.3s var(--ease);z-index:60;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:1100px){#app,#app.pan{grid-template-columns:72px 1fr 0}#app.pan{grid-template-columns:72px 1fr 300px}.nv span,.logo span,.sec{display:none}.nv{justify-content:center}.logo{justify-content:center;padding:0 0 18px}.rt select{display:none}}
@media (max-width:760px){#bar{grid-template-columns:1fr auto;}.rt{display:none}.hero{flex-direction:column;align-items:flex-start}#app.pan{grid-template-columns:0 1fr 0}}
</style></head><body>

 </aside>
 <main id="main"><div id="top"><button class="rb" id="bk" title="Atrás"><svg class="i"><use href="#i-back"/></svg></button><button class="rb" id="fw" title="Adelante"><svg class="i"><use href="#i-fwd"/></svg></button><label class="sb"><svg class="i"><use href="#i-search"/></svg><input id="q" placeholder="Buscar canciones, artistas, álbumes o géneros   ( / )" autocomplete="off"></label></div><div id="view"></div></main>
