<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ritmo</title>
<style>
:root{--bg1:#0d1b3a;--bg2:#1b3a78;--acc:#7dd3fc;--tx:#eaf3ff;--mut:#9db6d8;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.13)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0b1630;color:var(--tx);font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em}
svg.f{fill:currentColor;stroke:none}
#bg{position:fixed;inset:0;background:linear-gradient(165deg,var(--bg1),var(--bg2));transition:background .5s}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#hd{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
#hd h1{font-size:26px;font-weight:700;letter-spacing:-.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hd .back{font-size:24px;padding:6px 10px 6px 0;display:none}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:20px}
#sb{display:none;padding:0 16px 8px}
#sb input{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-size:15px;outline:0;user-select:text}
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 0 24px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:12px;padding:8px 16px}
.row.on{background:rgba(125,211,252,.1)}
.row.on .rt b{color:var(--acc)}
.cv{width:50px;height:50px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:22px;color:rgba(255,255,255,.85);background-size:cover;background-position:center;overflow:hidden;position:relative}
.cv.big{width:100%;height:100%;border-radius:inherit;font-size:80px}
.rt{flex:1;min-width:0}.rt b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt span{display:block;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.dur{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.mb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--mut);font-size:20px}
.act{display:flex;gap:10px;padding:6px 16px 12px}
.pill{flex:1;padding:12px;border-radius:14px;background:var(--acc);color:#07203a;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.pill.s{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:8px 16px}
.gc .cv{width:100%;height:auto;aspect-ratio:1;border-radius:16px;font-size:44px}
.gc b{display:block;font-size:14px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gc span{font-size:12px;color:var(--mut)}
.lc{display:flex;align-items:center;gap:14px;margin:0 16px 10px;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.lc .cv{width:56px;height:56px}
.empty{padding:50px 28px;text-align:center;color:var(--mut);line-height:1.6;font-size:14px}
.empty .cv{margin:0 auto 18px;width:84px;height:84px;border-radius:26px;font-size:40px;background:var(--card)}
.empty .pill{max-width:260px;margin:16px auto 0}
.sec{padding:14px 16px 6px;font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
#mini{display:none;margin:0 10px 8px;padding:8px 10px;border-radius:18px;background:rgba(20,40,84,.92);border:1px solid var(--line);align-items:center;gap:10px;position:relative;overflow:hidden;backdrop-filter:blur(10px)}
#mini .cv{width:44px;height:44px;border-radius:10px;font-size:18px}
#mini .pr{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);width:0}
#mini .ib{width:40px;height:40px;background:transparent;border:0;font-size:22px}
#tabs{display:flex;border-top:1px solid var(--line);background:rgba(8,16,36,.88);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;padding:10px 0 9px;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
#tabs button svg{font-size:23px}#tabs button.on{color:var(--acc)}
/* reproductor */
#pl{position:fixed;inset:0;background:linear-gradient(165deg,var(--bg1),var(--bg2));transform:translateY(102%);transition:transform .38s cubic-bezier(.2,.9,.2,1);z-index:10;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 22px calc(env(safe-area-inset-bottom) + 18px);overflow-y:auto}
#pl.open{transform:none}
#pl .top{display:flex;align-items:center;justify-content:space-between;color:var(--mut);font-size:13px}
#pl .top .ib{background:transparent;border:0}
#art{width:min(100%,60vh,380px);aspect-ratio:1;margin:12px auto 0;border-radius:28px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);transition:transform .4s}
#pl.pp #art{transform:scale(.9)}
#pt{font-size:24px;font-weight:700;margin-top:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pa{font-size:15px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;flex:1;height:26px}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:linear-gradient(90deg,var(--acc) var(--p,0%),rgba(255,255,255,.22) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-5.5px}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.ctl button{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;color:var(--tx)}
.ctl button.sm{font-size:22px;color:var(--mut)}.ctl button.sm.on{color:var(--acc)}
.ctl button.pp{width:72px;height:72px;background:var(--acc);color:#07203a;font-size:34px}
.sec2{display:flex;justify-content:space-around;margin-top:8px}
.sec2 button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mut);padding:8px 14px;font-size:11.5px}
.sec2 button svg{font-size:22px}.sec2 button.on{color:var(--acc)}
#viz{display:flex;align-items:flex-end;justify-content:center;gap:4px;height:38px;margin-top:10px}
#viz i{width:5px;border-radius:3px;background:var(--acc);height:8px;opacity:.85;animation:vz 1s ease-in-out infinite;animation-play-state:paused}
#pl.pp #viz i{animation-play-state:running}
@keyframes vz{0%,100%{height:6px}50%{height:34px}}
/* hojas */
#ov{position:fixed;inset:0;background:rgba(3,10,25,.6);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#ov.on{opacity:1;pointer-events:auto}
#sh{position:fixed;left:0;right:0;bottom:0;background:#0e1d3d;border-top:1px solid var(--line);border-radius:26px 26px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);transition:transform .32s;z-index:21;max-height:82vh;overflow-y:auto}
#sh.on{transform:none}
#sh h3{font-size:17px;font-weight:600;margin-bottom:4px}#sh .sub{font-size:13px;color:var(--mut);margin-bottom:12px}
.mi{display:flex;align-items:center;gap:14px;padding:14px 4px;font-size:15px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.mi:last-child{border:0}.mi svg{font-size:20px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{padding:10px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:14px}
.chip.on{background:var(--acc);color:#07203a;border-color:var(--acc);font-weight:600}
.sw{width:44px;height:44px;border-radius:50%;border:2px solid var(--line)}.sw.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
#sh input.t{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-size:16px;outline:0;margin:8px 0 14px;user-select:text}
.about{font-size:12px;color:var(--mut);line-height:1.6;margin-top:10px}
#toast,#utoast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:rgba(14,28,58,.97);border:1px solid var(--line);color:var(--tx);padding:11px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:all .3s;z-index:40;white-space:nowrap}
#toast.on,#utoast.on{opacity:1;transform:translate(-50%,0)}
.demo{margin:0 16px 8px;padding:8px 12px;border-radius:12px;background:rgba(255,184,107,.14);border:1px solid rgba(255,184,107,.5);color:#ffd9a8;font-size:12px}
#umodal{position:fixed;inset:0;background:rgba(3,10,25,.72);display:none;place-items:center;z-index:50}
#umodal.on{display:grid}
.dlg{width:min(88vw,350px);background:rgba(14,28,58,.98);border:1px solid var(--line);border-radius:26px;padding:24px 22px;text-align:center}
.dlg h3{font-size:19px;font-weight:600;margin-bottom:8px}.dlg p{font-size:14px;color:var(--mut);line-height:1.5}
.dlg ul{margin:10px 0 0;padding-left:18px;font-size:13px;color:var(--mut);line-height:1.5;text-align:left}
.dlg .rw{display:flex;gap:10px;margin-top:20px}
.dlg .bt{flex:1;padding:12px 8px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:15px}
.dlg .bt.pri{background:var(--acc);color:#07203a;border-color:var(--acc);font-weight:600}
.dlg .pct{font-size:30px;font-weight:300;margin-top:4px;font-variant-numeric:tabular-nums}
</style></head><body>

<script>
(function(){
var N=window.Native,DEMO=!N,$=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ic(n,c){return '<svg class="i'+(c?' '+c:'')+'"><use href="#i-'+n+'"/></svg>'}
function nat(f){try{if(N&&N[f])return N[f].apply(N,[].slice.call(arguments,1))}catch(e){}}
var THEMES=[['Azul noche','#0d1b3a','#1b3a78','#7dd3fc'],['Celeste','#2c5a9e','#6fb4ff','#e8f6ff'],['Violeta','#1b1240','#4a2f9c','#c4b5fd'],['Bosque','#0b2a2a','#14504a','#7ee0c3']];
var DB={fav:{},lists:[],sort:'t',theme:0};try{var sv=JSON.parse(localStorage.getItem('ritmo')||'{}');for(var k in sv)DB[k]=sv[k]}catch(e){}

function fmt(ms){ms=Math.max(0,Math.floor(ms/1000));var m=Math.floor(ms/60),s=ms%60;return m+':'+(s<10?'0':'')+s}

function grad(s){var h=hue(String(s));return 'linear-gradient(135deg,hsl('+h+',55%,42%),hsl('+((h+50)%360)+',60%,30%))'}
/* ---------- biblioteca ---------- */
var LIB=[],BY={},ART={},ST={id:0,playing:false,pos:0,dur:0,shuffle:false,repeat:0,sleep:0,title:'',artist:''},CTX=[],q='',tab='songs',stack=[],LST=null,permState=DEMO?'ok':'ask',loaded=false;

function filt(a){if(!q)return a;var s=q.toLowerCase();return a.filter(function(t){return (t.t+' '+t.a+' '+t.al).toLowerCase().indexOf(s)>=0})}

function favs(){return LIB.filter(function(t){return DB.fav[t.i]})}
function recents(){return LIB.slice().sort(function(a,b){return b.da-a.da}).slice(0,40)}
function listTracks(l){return l.ids.map(function(i){return BY[i]}).filter(Boolean)}
/* ---------- portadas ---------- */
var io=null;
function reqArt(id){if(ART[id]!==undefined)return;ART[id]=null;
 if(DEMO){setTimeout(function(){var c=document.createElement('canvas');c.width=c.height=240;var x=c.getContext('2d'),h=hue(String(id)),g=x.createLinearGradient(0,0,240,240);g.addColorStop(0,'hsl('+h+',60%,50%)');g.addColorStop(1,'hsl('+((h+60)%360)+',60%,28%)');x.fillStyle=g;x.fillRect(0,0,240,240);x.fillStyle='rgba(255,255,255,.18)';x.beginPath();x.arc(120,120,70,0,6.3);x.fill();x.beginPath();x.arc(120,120,16,0,6.3);x.fillStyle='rgba(0,0,0,.35)';x.fill();window.__art(id,c.toDataURL('image/jpeg',.8))},30);return}
 nat('art',String(id))}

function show(h){var m=$('umodal');m.innerHTML='<div class="dlg" id="upd">'+h+'</div>';m.classList.add('on')}
function hide(){$('umodal').classList.remove('on');$('umodal').innerHTML=''}
function apkCode(){try{return A&&A.apkCode?A.apkCode():0}catch(e){return 0}}
try{window.APK_NAME=A&&A.apkName?A.apkName():'0.1'}catch(e){}
/* cohete de lineas -> check (igual que en Crece Fit) */
var RK={N:220,SRC:null,TGT:null};
function samp(d,n){var p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);var L=p.getTotalLength(),r=[],i,q;for(i=0;i<n;i++){q=p.getPointAtLength(L*i/(n-1));r.push([q.x,q.y])}return r}
function ease(t){t=Math.max(0,Math.min(1,t));return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function rnd(i){var x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function startRocket(svg){
 var AC=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim()||'#7dd3fc',MUT='rgba(255,255,255,.28)';
 var RKD='M85 82 L85 72 L74 56 L75.5 56 C76 44 72 28 60 14 C48 28 44 44 44.5 56 L46 56 L35 72 L35 82 L46 74 L74 74 Z';
 if(!RK.SRC){RK.SRC=samp('M24 108 L96 108 L85 82 L85 72 L74 56 L75.5 56 C76 44 72 28 60 14 C48 28 44 44 44.5 56 L46 56 L35 72 L35 82 L46 74 L74 74 L85 82',RK.N);RK.TGT=samp('M38 62 L54 77 L84 44',RK.N)}
 svg.setAttribute('viewBox','0 0 120 120');
 var st={shown:0,target:0,t0:performance.now(),tf:-1,raf:0};upd.rk=st;
 function flame(t){var k=.7+.3*Math.sin(t*38),k2=.7+.3*Math.sin(t*31+1.7);return '<g fill="none" stroke="'+AC+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M55 80 Q60 '+(88+18*k)+' 65 80"/><path d="M60 86 L60 '+(92+12*k2)+'" opacity=".7"/></g>'}
 function speed(t,fade){var o='',i;for(i=0;i<9;i++){var x=14+rnd(i)*92,sp=1.1+rnd(i+9)*.9,y=((t*sp*140+rnd(i+20)*160)%160)-20,len=10+rnd(i+5)*14;if(Math.abs(x-60)<22)continue;o+='<line x1="'+x.toFixed(1)+'" y1="'+y.toFixed(1)+'" x2="'+x.toFixed(1)+'" y2="'+(y-len).toFixed(1)+'" stroke="'+AC+'" stroke-width="1.6" stroke-linecap="round" opacity="'+(.35*fade).toFixed(2)+'"/>'}return o}
 function frame(now){
  if(!svg.isConnected)return;
  var dt=(now-(st.last||now))/1000;st.last=now;var t=(now-st.t0)/1000,o='';
  if(st.shown<st.target)st.shown=Math.min(st.target,st.shown+Math.max(dt*260,(st.target-st.shown)*dt*6));
  var p=st.shown/100,BX0=24,BX1=96,BY=108;
  if(st.tf<0&&st.shown>=100)st.tf=t;
  if(st.tf<0){
   var shake=Math.sin(t*60)*.7+Math.sin(t*47)*.5,bob=Math.sin(t*3)*2.5;
   o+=speed(t,1)+'<g transform="translate('+shake.toFixed(2)+','+(bob-6).toFixed(2)+')">'+flame(t)+'<g fill="none" stroke="'+AC+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="'+RKD+'"/><circle cx="60" cy="42" r="7"/></g></g>';
   o+='<line x1="'+BX0+'" y1="'+BY+'" x2="'+BX1+'" y2="'+BY+'" stroke="'+MUT+'" stroke-width="3" stroke-linecap="round"/><line x1="'+BX0+'" y1="'+BY+'" x2="'+(BX0+(BX1-BX0)*p).toFixed(1)+'" y2="'+BY+'" stroke="'+AC+'" stroke-width="3.4" stroke-linecap="round"/>';
  }else{
   var u=t-st.tf,PA=.26,PM=.6;o+=speed(t,Math.max(0,1-u/.2));
   if(u<PA){var q=ease(u/PA);
    if(u<.12)o+='<g transform="translate(0,-6)" opacity="'+(1-u/.12).toFixed(2)+'">'+flame(t)+'</g>';
    o+='<g transform="translate(0,'+(-6*(1-q)).toFixed(2)+')" fill="none" stroke="'+AC+'" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="'+RKD+'"/><circle cx="60" cy="42" r="'+(7*(1-q)).toFixed(2)+'" opacity="'+(1-q).toFixed(2)+'"/></g>';
    o+='<line x1="'+BX0+'" y1="'+BY+'" x2="'+BX1+'" y2="'+BY+'" stroke="'+AC+'" stroke-width="3.2" stroke-linecap="round"/>';
    o+='<path d="M96 108 L85 82" fill="none" stroke="'+AC+'" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="28" stroke-dashoffset="'+(28*(1-q)).toFixed(1)+'"/>';
   }else{
    var m=ease(Math.min(1,(u-PA)/PM)),d='',i;
    for(i=0;i<RK.N;i++){d+=(i?' L':'M')+(RK.SRC[i][0]+(RK.TGT[i][0]-RK.SRC[i][0])*m).toFixed(2)+' '+(RK.SRC[i][1]+(RK.TGT[i][1]-RK.SRC[i][1])*m).toFixed(2)}
    var cu=ease(Math.max(0,Math.min(1,(u-PA-PM*.25)/(PM*.8)))),CC=2*Math.PI*44,pul=1+Math.sin(Math.max(0,Math.min(1,(u-PA-PM*.85)/.4))*Math.PI)*.06;
    o+='<g transform="translate(60,60) scale('+pul.toFixed(3)+') translate(-60,-60)"><circle cx="60" cy="60" r="44" fill="none" stroke="'+AC+'" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="'+CC.toFixed(1)+'" stroke-dashoffset="'+(CC*(1-cu)).toFixed(1)+'" transform="rotate(-90 60 60)"/>';
    o+='<path d="'+d+'" fill="none" stroke="'+AC+'" stroke-width="'+(3.2+m*2.2).toFixed(2)+'" stroke-linecap="round" stroke-linejoin="round"/></g>';
    var wv=(u-PA-PM*.9)/.6;if(wv>0&&wv<1)o+='<circle cx="60" cy="60" r="'+(46+wv*20).toFixed(1)+'" fill="none" stroke="'+AC+'" stroke-width="2" opacity="'+(.5*(1-wv)).toFixed(2)+'"/>';
   }}
  svg.innerHTML=o;st.raf=requestAnimationFrame(frame)}
 st.raf=requestAnimationFrame(frame)}
/* dialogos */
function showUpd(){show('<h3>Actualización disponible</h3><p>Hay mejoras nuevas y <b>no necesitas instalar nada</b>. Se descargan ahora: la app se cerrará sola y, al abrirla de nuevo, ya estará actualizada.</p><div class="rw"><button class="bt" data-a="no">Más tarde</button><button class="bt pri" data-a="go">Actualizar</button></div>')}
function notes(i){return(i&&i.notes&&i.notes.length)?'<ul>'+i.notes.slice(0,3).map(function(n){return'<li>'+esc(n)+'</li>'}).join('')+'</ul>':''}
function showApk(info,req){var v=info&&info.version?info.version:'?';show('<h3>'+(req?'Necesitas la nueva versión':'Nueva versión disponible')+'</h3><p>'+(req?'Esta actualización necesita instalar un APK nuevo (v'+esc(v)+'). ':'Hay un APK nuevo (v'+esc(v)+') con mejoras. ')+'Descárgalo desde la página, ábrelo e instálalo encima: <b>no pierdes tus ajustes</b>.</p>'+notes(info)+'<div class="rw"><button class="bt" data-a="no">Más tarde</button><button class="bt pri" data-a="site">Ir a descargar</button></div>')}
$('umodal').addEventListener('click',function(e){var a=e.target.getAttribute&&e.target.getAttribute('data-a');if(!a)return;
 if(a==='no')hide();
 else if(a==='site'){hide();try{A.openUrl('https://daijstudio.daijstudio.workers.dev/ritmo/')}catch(x){}}
 else if(a==='go'){upd.busy=true;show('<h3 id="uph">Actualizando…</h3><svg id="uprk" width="180" height="180" style="display:block;margin:4px auto 0"></svg><div class="pct" id="upt">0%</div><p id="upn" style="margin-top:6px">No cierres la app</p>');startRocket($('uprk'));
  try{if(A&&A.startUpdate)A.startUpdate();else{upd.busy=false;hide();location.reload()}}catch(x){window.__updateError()}}});
/* consulta */
function loadMeta(cb){var out={web:null,apk:null},n=0;function fin(){if(++n===2)cb(out)}
 function get(p,k){try{fetch(REMOTE+p+'?t='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(o){out[k]=o;fin()},function(){fin()})}catch(e){fin()}}
 get('ritmo-app/version.json','web');get('ritmo/apk.json','apk')}
function decide(out,nativeV,manual){
 if(!A)return;var code=apkCode(),web=out.web,apk=out.apk,canOta=!!(A&&A.startUpdate);
 apkInfo=(apk&&apk.code>code)?apk:null;var apkReq=!!(web&&(web.minApk||0)>code);
 var webNew=canOta&&!!(nativeV||(web&&web.version>(window.APP_VERSION||0)));
 if(!web&&!apk){if(nativeV&&!upd.shown){upd.shown=true;showUpd()}else if(manual)toast('No se pudo consultar. Revisa tu internet.');return}
 if(apkReq){if(manual||!upd.apkShown){upd.apkShown=true;showApk(apk,true)}}
 else if(webNew){if(manual)upd.shown=false;if(!upd.shown){upd.shown=true;showUpd()}}
 else if(manual){if(apkInfo)showApk(apk,false);else toast('Ya tienes lo último')}}
function jsCheck(manual){loadMeta(function(o){jsStat=o.web?'Web: v'+o.web.version:'Sin conexión con la web';decide(o,0,manual);window.__ambStatus&&window.__ambStatus()})}
window.__ambCheck=function(){upd.shown=false;upd.apkShown=false;toast('Buscando…');try{if(A&&A.checkNow)A.checkNow()}catch(e){}jsCheck(true)};
window.__ambStatus=function(){var e=$('ustat');if(!e)return;try{if(A&&A.updateStatus)natStat=A.updateStatus()}catch(x){}e.textContent=(natStat||'La app busca actualizaciones al abrirse.')+(jsStat?' · '+jsStat:'')};
window.__updateAvailable=function(v){if(upd.busy)return;loadMeta(function(o){decide(o,v,false)})};
window.__updateStatus=function(m,manual){natStat=m;if(manual)toast(m);window.__ambStatus()};
window.__updateProgress=function(p){var t=$('upt'),h=$('uph');if(upd.rk)upd.rk.target=p;if(t)t.textContent=p+'%';if(p>=100&&h){h.textContent='Listo. Cerrando la app…';var n=$('upn');if(n)n.textContent='La próxima vez que entres ya estará actualizada'}};
window.__updateError=function(m){upd.busy=false;hide();natStat=m||natStat;show('<h3>No se pudo actualizar</h3><p>'+esc(m||'Revisa tu internet e inténtalo de nuevo.')+'</p><div class="rw"><button class="bt pri" data-a="no">Entendido</button></div>')};
})();
</script>
