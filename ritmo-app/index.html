<html lang="es"><head><meta charset="utf-8">

<title>Ritmo</title>
<style>
:root{--sat:0px;--sab:0px}
:root{--bg:#08080c;--bg2:#101016;--tx:#f5f6fa;--mut:rgba(235,235,245,.58);--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.09);--acc:#4aa8ff;--blur:rgba(16,16,24,.74);--sheet:#15151d;--ease:cubic-bezier(.22,.9,.28,1)}

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}

#app{position:fixed;inset:0;display:flex;flex-direction:column}

#hdr{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;padding:calc(var(--sat) + 8px) 12px 8px;min-height:calc(var(--sat) + 52px);transition:background .25s,border-color .25s;border-bottom:1px solid transparent}

#main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 50px) 0 150px}
.pg{animation:fade .3s var(--ease)}

.cd{width:148px;flex:none;scroll-snap-align:start;animation:up .4s var(--ease) both}

.mb{width:34px;height:40px;display:grid;place-items:center;color:var(--mut);font-size:19px}

.hero.ar .cv{border-radius:50%}.hero h2{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-top:16px}.hero p{color:var(--mut);font-size:14px;margin-top:3px}.hero .sub{color:var(--acc);font-size:16px;margin-top:2px}

.bt.p{background:var(--acc);color:#fff}.html-claro .bt.p{color:#fff}

.mos .cv{border-radius:0;width:100%;height:100%;box-shadow:none}
.empty{padding:60px 30px;text-align:center;color:var(--mut);line-height:1.6;font-size:15px;animation:up .4s var(--ease)}
.empty .big{width:92px;height:92px;border-radius:28px;background:var(--card);display:grid;place-items:center;margin:0 auto 20px;font-size:44px;color:var(--acc)}

.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 10px}.chip{padding:9px 16px;border-radius:99px;background:var(--card);font-size:14px}.chip.on{background:var(--acc);color:#fff;font-weight:600}

/* mini */
#mini{position:absolute;left:10px;right:10px;bottom:calc(58px + var(--sab));height:58px;border-radius:16px;background:var(--blur);backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px);border:1px solid var(--line);display:none;align-items:center;gap:11px;padding:0 6px 0 8px;z-index:6;overflow:hidden;box-shadow:0 10px 30px -14px rgba(0,0,0,.6)}

.meta{display:flex;align-items:center;gap:10px;margin-top:6px}.meta .tx{flex:1;min-width:0}

.meta .ib.pop{animation:pop .45s var(--ease)}@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.srow{margin-top:14px}
input[type=range].sk{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:22px;display:block}
input[type=range].sk::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:linear-gradient(90deg,#fff var(--p,0%),rgba(255,255,255,.28) var(--p,0%));transition:height .2s}

.srow.d input[type=range].sk::-webkit-slider-thumb{width:16px;height:16px;margin-top:-3.5px}
.tm{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.62);font-variant-numeric:tabular-nums;margin-top:-1px}
.ctl{display:flex;align-items:center;justify-content:center;gap:34px;margin-top:6px}

#artw{position:relative}
#lyr{position:absolute;inset:0;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .35s;-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);padding:18vh 14px 18vh 6px;scrollbar-width:none;touch-action:pan-y}
#lyr::-webkit-scrollbar{display:none}

#art{transition:transform .6s var(--ease),opacity .35s}
#lyr .ll{font-size:27px;line-height:1.25;font-weight:800;color:rgba(255,255,255,.34);padding:9px 4px;transition:color .45s var(--ease),transform .6s var(--ease),filter .6s var(--ease),opacity .6s;transition-delay:calc(var(--d,0)*28ms);transform-origin:left center;cursor:pointer;filter:blur(var(--b,0px));will-change:transform,filter}

.pbar{display:flex;justify-content:space-between;margin-top:8px;gap:2px}

.eqr{display:flex;align-items:center;gap:12px;padding:8px 0}.eqr label{width:56px;font-size:13px;color:var(--mut)}

   o+='<line x1="'+BX0+'" y1="'+BY+'" x2="'+BX1+'" y2="'+BY+'" stroke="'+MUT+'" stroke-width="3" stroke-linecap="round"/><line x1="'+BX0+'" y1="'+BY+'" x2="'+(BX0+(BX1-BX0)*p).toFixed(1)+'" y2="'+BY+'" stroke="'+AC+'" stroke-width="3.4" stroke-linecap="round"/>';
  }else{
   var u=t-st.tf,PA=.26,PM=.6;o+=speed(t,Math.max(0,1-u/.2));
   if(u<PA){var q=ease(u/PA);
    if(u<.12)o+='<g transform="translate(0,-6)" opacity="'+(1-u/.12).toFixed(2)+'">'+flame(t)+'</g>';
    o+='<g transform="translate(0,'+(-6*(1-q)).toFixed(2)+')" fill="none" stroke="'+AC+'" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="'+RKD+'"/><circle cx="60" cy="42" r="'+(7*(1-q)).toFixed(2)+'" opacity="'+(1-q).toFixed(2)+'"/></g>';

   }else{
    var m=ease(Math.min(1,(u-PA)/PM)),d='',i;

    var cu=ease(Math.max(0,Math.min(1,(u-PA-PM*.25)/(PM*.8)))),CC=2*Math.PI*44,pul=1+Math.sin(Math.max(0,Math.min(1,(u-PA-PM*.85)/.4))*Math.PI)*.06;
    o+='<g transform="translate(60,60) scale('+pul.toFixed(3)+') translate(-60,-60)"><circle cx="60" cy="60" r="44" fill="none" stroke="'+AC+'" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="'+CC.toFixed(1)+'" stroke-dashoffset="'+(CC*(1-cu)).toFixed(1)+'" transform="rotate(-90 60 60)"/>';

    var wv=(u-PA-PM*.9)/.6;if(wv>0&&wv<1)o+='<circle cx="60" cy="60" r="'+(46+wv*20).toFixed(1)+'" fill="none" stroke="'+AC+'" stroke-width="2" opacity="'+(.5*(1-wv)).toFixed(2)+'"/>';

/* dialogos */
function showUpd(){show('<h3>Actualización disponible</h3><p>Hay mejoras nuevas y <b>no necesitas instalar nada</b>. Se descargan ahora: la app se cerrará sola y, al abrirla de nuevo, ya estará actualizada.</p><div class="rw"><button class="bt2" data-a="no">Más tarde</button><button class="bt2 pri" data-a="go">Actualizar</button></div>')}
function notes(i){return(i&&i.notes&&i.notes.length)?'<ul>'+i.notes.slice(0,3).map(function(n){return'<li>'+esc(n)+'</li>'}).join('')+'</ul>':''}
function showApk(info,req){lastApk=req?0:(info&&info.code)||0;var v=info&&info.version?info.version:'?';show('<h3>'+(req?'Necesitas la nueva versión':'Nueva versión disponible')+'</h3><p>'+(req?'Esta actualización necesita instalar un APK nuevo (v'+esc(v)+'). ':'Hay un APK nuevo (v'+esc(v)+') con mejoras. ')+'Descárgalo desde la página, ábrelo e instálalo encima: <b>no pierdes tus ajustes</b>.</p>'+notes(info)+'<div class="rw"><button class="bt2" data-a="no">Más tarde</button><button class="bt2 pri" data-a="site">Ir a descargar</button></div>')}
$('umodal').addEventListener('click',function(e){var a=e.target.getAttribute&&e.target.getAttribute('data-a');if(!a)return;
 if(a==='no'){if(lastApk){try{localStorage.setItem('apkd',String(lastApk))}catch(x){}lastApk=0}hide()}
 else if(a==='site'){hide();try{A.openUrl('https://daijstudio.daijstudio.workers.dev/ritmo/')}catch(x){}}
 else if(a==='go'){upd.busy=true;show('<h3 id="uph">Actualizando…</h3><svg id="uprk" width="180" height="180" style="display:block;margin:4px auto 0"></svg><div class="pct" id="upt">0%</div><p id="upn" style="margin-top:6px">No cierres la app</p>');startRocket($('uprk'));
  try{if(A&&A.startUpdate)A.startUpdate();else{upd.busy=false;hide();location.reload()}}catch(x){window.__updateError()}}});
/* consulta */
function loadMeta(cb){var out={web:null,apk:null},n=0;function fin(){if(++n===2)cb(out)}
 function get(p,k){try{fetch(REMOTE+p+'?t='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(o){out[k]=o;fin()},function(){fin()})}catch(e){fin()}}
 get('ritmo-app/version.json','web');get('ritmo/apk.json','apk')}
function decide(out,nativeV,manual){
 if(!A)return;var code=apkCode(),web=out.web,apk=out.apk,canOta=!!(A&&A.startUpdate);
 apkInfo=(apk&&apk.code>code)?apk:null;var apkReq=!!(web&&(web.minApk||0)>code);
 var webNew=canOta&&!!(nativeV||(web&&web.version>(window.APP_VERSION||0)));
 if(!web&&!apk){if(nativeV&&!upd.shown){upd.shown=true;showUpd()}else if(manual)toast('No se pudo consultar. Revisa tu internet.');return}
 if(apkReq){if(manual||!upd.apkShown){upd.apkShown=true;showApk(apk,true)}}
 else if(webNew){if(manual)upd.shown=false;if(!upd.shown){upd.shown=true;showUpd()}}
 else if(apkInfo){var dis=0;try{dis=+localStorage.getItem('apkd')||0}catch(x){}if(manual||(!upd.apkShown&&dis!==apk.code)){upd.apkShown=true;showApk(apk,false)}}
 else if(manual)toast('Ya tienes lo último')}
function jsCheck(manual){loadMeta(function(o){jsStat=o.web?'Web: v'+o.web.version:'Sin conexión con la web';decide(o,0,manual);window.__ambStatus&&window.__ambStatus()})}
window.__ambCheck=function(){upd.shown=false;upd.apkShown=false;toast('Buscando…');try{if(A&&A.checkNow)A.checkNow()}catch(e){}jsCheck(true)};
window.__ambStatus=function(){var e=$('ustat');if(!e)return;try{if(A&&A.updateStatus)natStat=A.updateStatus()}catch(x){}e.textContent=(natStat||'La app busca actualizaciones al abrirse.')+(jsStat?' · '+jsStat:'')};
setTimeout(function(){if(A)jsCheck(false)},2500);
window.__updateAvailable=function(v){if(upd.busy)return;loadMeta(function(o){decide(o,v,false)})};
window.__updateStatus=function(m,manual){natStat=m;if(manual)toast(m);window.__ambStatus()};
window.__updateProgress=function(p){var t=$('upt'),h=$('uph');if(upd.rk)upd.rk.target=p;if(t)t.textContent=p+'%';if(p>=100&&h){h.textContent='Listo. Cerrando la app…';var n=$('upn');if(n)n.textContent='La próxima vez que entres ya estará actualizada'}};
window.__updateError=function(m){upd.busy=false;hide();natStat=m||natStat;show('<h3>No se pudo actualizar</h3><p>'+esc(m||'Revisa tu internet e inténtalo de nuevo.')+'</p><div class="rw"><button class="bt2 pri" data-a="no">Entendido</button></div>')};
})();
