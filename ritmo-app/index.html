<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Nova Music</title>
<style>
:root{--sat:0px;--sab:0px}
:root{--bg:#08080c;--bg2:#101016;--tx:#f5f6fa;--mut:rgba(235,235,245,.58);--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.09);--acc:#4aa8ff;--blur:rgba(16,16,24,.74);--sheet:#15151d;--ease:cubic-bezier(.22,.9,.28,1)}

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
@media (min-width:820px){html.rem{background:#04060d}html.rem body{max-width:520px;margin:0 auto;position:relative;transform:translateZ(0);box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(0,0,0,.55)}}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:Inter,-apple-system,system-ui,Segoe UI,Roboto,sans-serif;user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em}
svg.f{fill:currentColor;stroke:none}
.press{transition:transform .18s var(--ease),opacity .18s}.press:active{transform:scale(.96);opacity:.85}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#glow{position:absolute;left:0;right:0;top:0;height:46vh;background:radial-gradient(120% 90% at 50% -10%,color-mix(in srgb,var(--acc) 26%,transparent),transparent 70%);pointer-events:none;opacity:.8}
#hdr{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;padding:calc(var(--sat) + 8px) 12px 8px;min-height:calc(var(--sat) + 52px);transition:background .25s,border-color .25s;border-bottom:1px solid transparent}
#hdr.sc{background:var(--blur);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px);border-color:var(--line)}
#hdr .bk{display:none;align-items:center;gap:2px;color:var(--acc);font-size:16px;padding:8px 8px 8px 2px}
#hdr .st{flex:1;text-align:center;font-weight:600;font-size:16px;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
#hdr.sc .st{opacity:1}
#hdr .rb{margin-left:auto;display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--acc)}
#main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 50px) 0 150px}
.pg{animation:fade .3s var(--ease)}
.pg.r{animation:inR .34s var(--ease)}.pg.l{animation:inL .34s var(--ease)}
@keyframes inR{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.lt{font-size:32px;font-weight:800;letter-spacing:-.03em;padding:4px 18px 10px}
.sh2{display:flex;align-items:baseline;justify-content:space-between;padding:22px 18px 10px}
.sh2 b{font-size:20px;font-weight:700;letter-spacing:-.02em}.sh2 span{font-size:14px;color:var(--acc)}
.hs{display:flex;gap:14px;overflow-x:auto;padding:0 18px 4px;scroll-padding:0 18px;scroll-snap-type:x proximity;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.cd{width:148px;flex:none;scroll-snap-align:start;animation:up .4s var(--ease) both}
.cd .cv{width:148px;height:148px;border-radius:14px}
.cd.ar{width:112px}.cd.ar .cv{width:112px;height:112px;border-radius:50%}.cd.ar b,.cd.ar span{text-align:center}
.cd b{display:block;font-size:14px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd span{display:block;font-size:12.5px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv{border-radius:10px;flex:none;display:grid;place-items:center;font-size:24px;color:rgba(255,255,255,.8);background-size:cover;background-position:center;overflow:hidden;position:relative;box-shadow:0 6px 18px -8px rgba(0,0,0,.5)}
.mix{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 18px}
.mx{border-radius:18px;padding:16px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;position:relative;overflow:hidden;animation:up .4s var(--ease) both}
.mx b{display:block;font-size:16px;font-weight:700;line-height:1.15}.mx span{display:block;font-size:12px;opacity:.82;margin-top:2px}.mx svg{font-size:24px}
.row{display:flex;align-items:center;gap:13px;padding:7px 18px;animation:up .38s var(--ease) both}
.row .cv{width:52px;height:52px;border-radius:9px}
.row .rt{flex:1;min-width:0;padding:6px 0;border-bottom:1px solid var(--line)}.row:last-child .rt{border:0}
.rt b{display:block;font-size:15.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rt span{display:block;font-size:13px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.on .rt b{color:var(--acc)}
.row .end{display:flex;align-items:center;gap:2px;color:var(--mut);font-size:12.5px;font-variant-numeric:tabular-nums}
.mb{width:34px;height:40px;display:grid;place-items:center;color:var(--mut);font-size:19px}
.eqb{display:none;gap:2px;align-items:flex-end;height:14px;margin-right:6px}.eqb i{width:3px;background:var(--acc);border-radius:2px;height:5px}
.row.on .eqb{display:flex}.row.on.pl .eqb i{animation:eqa .8s ease-in-out infinite}.eqb i:nth-child(2){animation-delay:-.3s!important}.eqb i:nth-child(3){animation-delay:-.6s!important}
@keyframes eqa{0%,100%{height:4px}50%{height:14px}}
.lr{display:flex;align-items:center;gap:14px;padding:0 18px;animation:up .38s var(--ease) both}
.lr .ic{width:34px;font-size:22px;color:var(--acc);text-align:center}
.lr .rt{padding:14px 0}.lr .rt b{font-size:17px;font-weight:400}.lr .n{color:var(--mut);font-size:15px;display:flex;align-items:center;gap:4px}
.gc{flex:none;border-radius:18px;padding:14px;color:#fff;position:relative;overflow:hidden;min-height:104px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;opacity:0;animation:cin .45s var(--ease) forwards;box-shadow:0 14px 26px -16px rgba(0,0,0,.6)}
.gc .gi{position:absolute;right:-6px;top:-6px;font-size:86px;opacity:.2;transform:rotate(14deg);stroke-width:1.5}
.gc b{font-size:16px;font-weight:700;position:relative}.gc span{font-size:12px;opacity:.8;position:relative}
.hs .gc{width:148px}.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 18px}
.hero.gh .gbig{width:min(48vw,190px);height:min(48vw,190px);border-radius:28px;display:grid;place-items:center;color:#fff;font-size:84px;box-shadow:0 24px 40px -18px rgba(0,0,0,.6)}
@keyframes cin{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 24px 6px}
.hero .cv{width:min(62vw,250px);height:min(62vw,250px);border-radius:16px;box-shadow:0 24px 40px -18px rgba(0,0,0,.6)}
.hero.ar .cv{border-radius:50%}.hero h2{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-top:16px}.hero p{color:var(--mut);font-size:14px;margin-top:3px}.hero .sub{color:var(--acc);font-size:16px;margin-top:2px}
.btns{display:flex;gap:12px;padding:16px 18px 8px}
.bt{flex:1;padding:13px;border-radius:13px;background:var(--card);color:var(--acc);font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.bt.p{background:var(--acc);color:#fff}.html-claro .bt.p{color:#fff}
.mos{display:grid;grid-template-columns:1fr 1fr;width:min(62vw,250px);height:min(62vw,250px);border-radius:16px;overflow:hidden;box-shadow:0 24px 40px -18px rgba(0,0,0,.6)}
.mos .cv{border-radius:0;width:100%;height:100%;box-shadow:none}
.empty{padding:60px 30px;text-align:center;color:var(--mut);line-height:1.6;font-size:15px;animation:up .4s var(--ease)}
.empty .big{width:92px;height:92px;border-radius:28px;background:var(--card);display:grid;place-items:center;margin:0 auto 20px;font-size:44px;color:var(--acc)}
.empty h3{font-size:21px;color:var(--tx);font-weight:700;margin-bottom:6px}
.empty .bt{max-width:280px;margin:18px auto 0}
.sbar{margin:4px 18px 8px;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:0 12px;color:var(--mut)}
.sbar input{flex:1;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:17px;padding:11px 0;user-select:text}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 10px}.chip{padding:9px 16px;border-radius:99px;background:var(--card);font-size:14px}.chip.on{background:var(--acc);color:#fff;font-weight:600}
.demo{margin:0 18px 10px;padding:9px 12px;border-radius:12px;background:rgba(255,184,107,.14);color:#e6a05a;font-size:12.5px}
/* mini */
#mini{position:absolute;left:10px;right:10px;bottom:calc(58px + var(--sab));height:58px;border-radius:16px;background:var(--blur);backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px);border:1px solid var(--line);display:none;align-items:center;gap:11px;padding:0 6px 0 8px;z-index:6;overflow:hidden;box-shadow:0 10px 30px -14px rgba(0,0,0,.6)}

@keyframes upM{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
#mini .cv{width:42px;height:42px;border-radius:8px;font-size:18px}
#mini .rt b{font-size:15px;font-weight:600}#mini .rt span{font-size:12.5px}
#mini .ib{width:42px;height:42px;font-size:24px;color:var(--tx)}
#mini .pr{position:absolute;left:0;bottom:0;height:2px;background:var(--acc);width:0}
#tabs{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--blur);backdrop-filter:blur(26px) saturate(1.6);-webkit-backdrop-filter:blur(26px);border-top:1px solid var(--line);padding-bottom:var(--sab);z-index:5}
#tabs button{flex:1;padding:8px 0 7px;color:var(--mut);font-size:10.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s}
#tabs button svg{font-size:25px;transition:transform .3s var(--ease)}#tabs button.on{color:var(--acc)}#tabs button.on svg{transform:translateY(-1px) scale(1.08)}
/* reproductor */
#pl{position:fixed;inset:0;z-index:20;transform:translateY(104%);transition:transform .5s var(--ease);display:flex;flex-direction:column;padding:calc(var(--sat) + 8px) 26px calc(var(--sab) + 16px);overflow:hidden;color:#fff;background:#000;will-change:transform}
#pl.open{transform:none}#pl.drag{transition:none}
.pbg{position:absolute;inset:0;transition:opacity .7s;opacity:0}.pbg.on{opacity:1}
#pov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.45))}
#pl>*:not(.pbg):not(#pov){position:relative}
.grab{width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.35);margin:2px auto 0;touch-action:none}
#pt1{display:flex;align-items:center;justify-content:space-between;padding:6px 0;touch-action:none}
#pt1 span{font-size:13px;color:rgba(255,255,255,.7);font-weight:500;letter-spacing:.02em}
#pl .ib{color:#fff}
#artw{flex:1;display:grid;place-items:center;min-height:0;padding:6px 0;touch-action:none}
#art{width:min(100%,46vh,370px);aspect-ratio:1;border-radius:20px;overflow:hidden;box-shadow:0 36px 60px -22px rgba(0,0,0,.75);transform:scale(.84);transition:transform .6s var(--ease)}
#pl.pp #art{transform:scale(1)}
#art .cv{width:100%;height:100%;border-radius:0;font-size:90px;box-shadow:none}
.meta{display:flex;align-items:center;gap:10px;margin-top:6px}.meta .tx{flex:1;min-width:0}
#pt{font-size:22px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pa{font-size:17px;color:rgba(255,255,255,.7);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .ib{width:40px;height:40px;background:rgba(255,255,255,.16);font-size:20px}
.meta .ib.pop{animation:pop .45s var(--ease)}@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.srow{margin-top:14px}
input[type=range].sk{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:22px;display:block}
input[type=range].sk::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:linear-gradient(90deg,#fff var(--p,0%),rgba(255,255,255,.28) var(--p,0%));transition:height .2s}
input[type=range].sk::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:0;border-radius:50%;background:#fff;margin-top:-5px;transition:all .2s}
.srow.d input[type=range].sk::-webkit-slider-runnable-track{height:9px}
.srow.d input[type=range].sk::-webkit-slider-thumb{width:16px;height:16px;margin-top:-3.5px}
.tm{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.62);font-variant-numeric:tabular-nums;margin-top:-1px}
.ctl{display:flex;align-items:center;justify-content:center;gap:34px;margin-top:6px}
.ctl button{color:#fff;display:grid;place-items:center;font-size:38px;width:64px;height:64px}
.ctl button.pp{font-size:48px;width:80px;height:80px}
.ctl button:active{transform:scale(.88)}.ctl button{transition:transform .2s var(--ease)}
#artw{position:relative}
#lyr{position:absolute;inset:0;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .35s;-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);padding:18vh 14px 18vh 6px;scrollbar-width:none;touch-action:pan-y}
#lyr::-webkit-scrollbar{display:none}
#pl.lyrOn #lyr{opacity:1;pointer-events:auto}#pl.lyrOn #art{opacity:0;transform:scale(.7);pointer-events:none}
#art{transition:transform .6s var(--ease),opacity .35s}
#lyr .ll{font-size:27px;line-height:1.25;font-weight:800;color:rgba(255,255,255,.34);padding:9px 4px;transition:color .45s var(--ease),transform .6s var(--ease),filter .6s var(--ease),opacity .6s;transition-delay:calc(var(--d,0)*28ms);transform-origin:left center;cursor:pointer;filter:blur(var(--b,0px));will-change:transform,filter}
@keyframes lpop{0%{transform:translateY(16px) scale(.94);opacity:.4}60%{transform:translateY(-2px) scale(1.06)}100%{transform:translateY(0) scale(1.03);opacity:1}}

#lyr .src{font-size:11px;color:rgba(255,255,255,.4);padding:18px 4px;font-weight:600}
.pbar{display:flex;justify-content:space-between;margin-top:8px;gap:2px}
.pbar button{flex:0 0 calc((100% - 12px)/7);min-width:0;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:16px;transition:background .25s,color .25s,transform .15s;font-size:21px;color:rgba(255,255,255,.68);position:relative}
.pbar button span{font-size:10px;font-weight:600;line-height:1;letter-spacing:.01em;white-space:nowrap}.pbar button:active{transform:scale(.92)}.pbar button.on{color:#fff;background:rgba(255,255,255,.17)}.pbar button.on span{font-weight:600}
.pbar small{position:absolute;right:3px;top:3px;font-size:9px;font-weight:700;background:rgba(255,255,255,.25);border-radius:6px;padding:0 4px}
/* hojas */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:30;backdrop-filter:blur(2px)}
#ov.on{opacity:1;pointer-events:auto}

.mi{display:flex;align-items:center;gap:15px;padding:15px 2px;font-size:17px;border-bottom:1px solid var(--line);width:100%;text-align:left}

.sw{width:44px;height:44px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2)}.sw.on{border-color:var(--tx)}

.eqr{display:flex;align-items:center;gap:12px;padding:8px 0}.eqr label{width:56px;font-size:13px;color:var(--mut)}
input[type=range].ez{-webkit-appearance:none;appearance:none;background:transparent;flex:1;height:26px}

.tg{width:52px;height:31px;border-radius:99px;background:var(--line);position:relative;transition:background .25s;margin-left:auto}.tg::after{content:"";position:absolute;left:3px;top:3px;width:25px;height:25px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}.tg.on{background:var(--acc)}.tg.on::after{transform:translateX(21px)}
.about{font-size:12px;color:var(--mut);line-height:1.6;margin-top:12px}

</style></head><body>

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){var t=e.target,el;
 if(t.id==='ov'){closeSheet();return}
 if((el=t.closest('.mb'))){menu(el.dataset.m);return}
 if((el=t.closest('[data-jq]'))){P.jump(+el.dataset.jq);closeSheet();return}
 if((el=t.closest('[data-tc]'))){var p=el.dataset.tc.split(':'),arr=(window.__TC||{})[p[0]]||[];playItems(arr,+p[1],false);return}
 if((el=t.closest('.row[data-k]'))){var src=(el.closest('#res')?window.__SR:LST&&LST.items)||[];var k=+el.dataset.k;if(el.closest('#res'))P.play(src.map(function(x){return x.i}),k,false);else playItems(LST.items,k,false);if(q&&q.length>1){DB.searches=[q].concat(DB.searches.filter(function(s){return s!==q})).slice(0,8);save()}return}
 if((el=t.closest('[data-al]'))){var a=HOLD[el.dataset.al];nav.stack.push({t:'album',id:el.dataset.al,title:nav.stack.length?(HOLD[top().id]||{}).name:undefined});render('r');return}
 if((el=t.closest('[data-ge]'))){nav.stack.push({t:'genre',id:el.dataset.ge});render('r');return}
 if((el=t.closest('[data-ar]'))){nav.stack.push({t:'artist',id:el.dataset.ar});render('r');return}
 if((el=t.closest('[data-ls]'))){nav.stack.push({t:'list',k:+el.dataset.ls});render('r');return}
 if((el=t.closest('[data-go]'))){nav.stack.push({t:'smart',id:el.dataset.go});render('r');return}
 if((el=t.closest('[data-tab2]'))){nav.stack.push({t:el.dataset.tab2});render('r');return}
 if((el=t.closest('[data-sm]'))){playItems(LIB,0,true);return}
 if((el=t.closest('[data-sq]'))){q=el.dataset.sq;render();var i=document.querySelector('.sbar input');if(i)i.focus();return}
 if((el=t.closest('[data-newlist]'))){newList();return}
 if((el=t.closest('[data-a]'))){var a2=el.dataset.a;
  if(a2==='all'||a2==='shuf'){var v=top(),items=LST?LST.items:[];if(a2==='all')playItems(items,0,false);else playItems(items,0,true)}
  else if(a2==='perm')nat('askPerm');else if(a2==='settings')nat('openSettings');else if(a2==='rescan'){loaded=false;render();nat('scan')}
  else if(a2==='dellist'){DB.lists.splice(top().k,1);save();nav.stack.pop();render('l');toast('Lista borrada')}
  return}
 if((el=t.closest('[data-s]'))){var s=el.dataset.s,id=el.dataset.id;
  if(s==='next'){P.add(id,true);closeSheet();toast('Sonará a continuación')}
  else if(s==='queue'){P.add(id,false);closeSheet();toast('Agregada a la cola')}
  else if(s==='fav'){if(DB.fav[id])delete DB.fav[id];else DB.fav[id]=1;save();closeSheet();onState();render();toast(DB.fav[id]?'Agregada a favoritas':'Quitada de favoritas')}
  else if(s==='tolist'){if(!DB.lists.length)newList(function(k){DB.lists[k].ids.push(+id);save();toast('Agregada a la lista');render()});else pickList(id)}
  else if(s==='addto'){var l=DB.lists[+el.dataset.k];if(l.ids.indexOf(+id)<0)l.ids.push(+id);save();closeSheet();toast('Agregada a «'+l.name+'»')}
  else if(s==='newadd')newList(function(k){DB.lists[k].ids.push(+id);save();toast('Agregada a la lista');render()});
  else if(s==='rmlist'){var l2=DB.lists[top().k];l2.ids=l2.ids.filter(function(x){return x!=id});save();closeSheet();render()}
