<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plano de la casa · daij studio</title>
<style>
:root{--bg:#0b1630;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--tx:#eaf3ff;--mut:#9db6d8;--acc:#7dd3fc}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif}
#app{display:grid;grid-template-columns:1fr 310px;grid-template-rows:56px 1fr;height:100%}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(8,16,36,.9)}
header b{font-weight:700}header span{color:var(--mut);font-size:13px}
.seg{display:flex;gap:4px;margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;color:var(--mut);padding:7px 14px;border-radius:9px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--acc);color:#07203a;font-weight:600}
main{position:relative;min-height:0;display:flex;flex-direction:column}
#panes{flex:1;min-height:0;display:grid;grid-template-columns:1fr}
main.split #panes{grid-template-columns:1fr 1fr}
.pane{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px;overflow:hidden}
.pane+.pane{border-left:1px solid var(--line)}.pane.h{display:none}
#v3{padding:0}
#svgw{width:100%;height:100%;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0}
#svgw svg{height:100%;width:auto;max-width:100%;border-radius:8px;box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.lab{position:absolute;left:14px;top:12px;font-size:12px;color:var(--mut);background:rgba(8,16,36,.75);padding:4px 10px;border-radius:99px;border:1px solid var(--line);pointer-events:none;z-index:2}
#tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px;background:rgba(8,16,36,.85);border-top:1px solid var(--line)}
.tb{padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--tx);font:inherit;font-size:13px;cursor:pointer}
.tb:hover{border-color:var(--acc)}.tb.on{background:var(--acc);color:#07203a;border-color:var(--acc);font-weight:600}
aside{overflow:auto;border-left:1px solid var(--line);padding:14px;background:rgba(8,16,36,.55)}
aside h3{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin:6px 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h4{font-size:15px;font-weight:600}.card p{font-size:12px;color:var(--mut);margin-top:3px;line-height:1.5}
.it{cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;background:var(--panel)}
.it:hover{border-color:var(--acc)}.it.on{border-color:var(--acc);background:rgba(125,211,252,.12)}
.it b{font-size:14px;font-weight:600}.it small{display:block;color:var(--mut);font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums}
ul{padding-left:18px;font-size:13px;color:var(--mut);line-height:1.5}
.warn{border-color:#ffb86b;color:#ffd9a8;font-size:12px;line-height:1.5}
#lbl{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.dl{position:absolute;transform:translate(-50%,-50%);background:#fff;color:#c0392b;border:1.5px solid #c0392b;border-radius:8px;padding:1px 7px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.35)}
#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-20px);background:var(--acc);color:#07203a;font-weight:600;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:all .3s;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:860px){#app{grid-template-columns:1fr;grid-template-rows:56px 1fr 200px}header{grid-column:1}aside{border-left:0;border-top:1px solid var(--line)}header span{display:none}main.split #panes{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.pane+.pane{border-left:0;border-top:1px solid var(--line)}}
</style></head><body>
<div id="app">
<header><b>Plano de la casa</b><span id="ttl"></span>
 <div class="seg" id="seg"><button data-v="2d" class="on">Planta 2D</button><button data-v="3d">3D</button><button data-v="split">Dividido</button></div></header>
<main id="main"><div id="panes">
 <div class="pane" id="v2"><div class="lab">Planta (medidas en metros)</div><div id="svgw"></div></div>
 <div class="pane h" id="v3"><div class="lab">Vista 3D · arrastra para girar</div><canvas id="cv"></canvas><div id="lbl"></div></div>
 </div>
 <div id="tools"><button class="tb on" id="bCot">Cotas</button><button class="tb on" id="bGrid">Cuadrícula</button><button class="tb on" id="bSim">Simulación</button><button class="tb" id="bTop">3D desde arriba</button><button class="tb" id="bPersp">3D en perspectiva</button><button class="tb" id="bPng">Guardar PNG</button></div>
</main>
<aside><h3>Proyecto</h3><div class="card"><h4 id="pt"></h4><p id="pm"></p></div>
 <h3>Avisos</h3><div id="av"></div>
 <h3>Últimos cambios</h3><div class="card"><ul id="ch"></ul></div>
 <h3>Elementos</h3><div id="pl"></div></aside>
</div><div id="toast"></div>

<script type="module">
import * as THREE from 'three';
